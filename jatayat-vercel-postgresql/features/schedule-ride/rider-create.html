<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create a Schedule Ride | Jatra</title><link rel="stylesheet" href="../../shared/css/style.css">
</head>
<body data-page="rider-create-schedule">
  <header class="site-header"><div class="header-inner"><a class="back-link" href="../../features/schedule-ride/rider-menu.html" aria-label="Back">&#8592;</a><a class="brand" href="../../features/auth/index.html" aria-label="Jatra Home"><img src="../../shared/assets/images/logo.png" alt="Jatra logo"></a><div class="header-spacer"></div></div></header>
  <main class="page-main form-page-main">
    <section class="form-card">
      <h1>Create a Schedule Ride</h1>
      <form class="standard-form" id="riderScheduleForm">
        <label class="form-field"><span>Pick Up Location</span><input id="riderPickup" type="text" required></label>
        <div class="destination-group" id="riderDestinations">
          <label class="form-field"><span>Destination</span><span class="destination-line"><input class="destination-input" type="text" required><button class="destination-add" id="addRiderDestination" type="button">+</button></span></label>
        </div>
        <label class="form-field"><span>Date</span><input id="riderDate" type="date" required></label>
        <label class="form-field"><span>Pick Up Time</span><input id="riderPickupTime" type="time" required></label>
        <label class="form-field"><span>Drop Time</span><input id="riderDropTime" type="time" required></label>
        <label class="form-field"><span>Available Seat</span><input id="riderSeat" type="number" min="1" required></label>
        <label class="form-field"><span>Per Seat Fare</span><input id="riderFare" type="number" min="0" required></label>
        <button class="form-submit rider-menu-color" type="submit">Create a Schedule Ride</button>
      </form>
    </section>
  </main>
  <script src="../../shared/js/app.js"></script>
</body>
</html>
