<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment | Jatra</title>
  <link rel="stylesheet" href="../../shared/css/style.css">
</head>
<body data-page="payment">
  <header class="site-header">
    <div class="header-inner">
      <a class="back-link" id="paymentBackLink" href="../../features/active-ride/index.html" aria-label="Back">&#8592;</a>
      <a class="brand" href="../../features/auth/index.html" aria-label="Jatra Home">
        <img src="../../shared/assets/images/logo.png" alt="Jatra logo">
      </a>
      <div class="header-spacer"></div>
    </div>
  </header>

  <main class="page-main payment-main">
    <section class="payment-card">
      <h1>Payment</h1>
      <div class="fare-row"><span>Total Fare</span><strong>৳ 120</strong></div>

      <div class="payment-methods">
        <button class="payment-method" data-payment="cash">
          <span class="cash-icon">৳</span><strong>Pay by Cash</strong>
        </button>
        <button class="payment-method" data-payment="bkash">
          <img src="../../shared/assets/images/bkash.png" alt="bKash"><strong>bKash</strong>
        </button>
        <button class="payment-method" data-payment="nagad">
          <img src="../../shared/assets/images/nagad.png" alt="Nagad"><strong>Nagad</strong>
        </button>
        <button class="payment-method" data-payment="rocket">
          <img src="../../shared/assets/images/rocket.webp" alt="Rocket"><strong>Rocket</strong>
        </button>
      </div>

      <div class="payment-result hidden" id="paymentResult"></div>
    </section>
  </main>

  <div class="toast hidden" id="toast"></div>
  <script src="../../shared/js/app.js"></script>
</body>
</html>
