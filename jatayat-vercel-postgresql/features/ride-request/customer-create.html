<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ride Request | Jatra</title><link rel="stylesheet" href="../../shared/css/style.css">
</head>
<body data-page="customer-ride-request">
  <header class="site-header"><div class="header-inner"><a class="back-link" href="../../features/customer-dashboard/index.html" aria-label="Back">&#8592;</a><a class="brand" href="../../features/auth/index.html" aria-label="Jatra Home"><img src="../../shared/assets/images/logo.png" alt="Jatra logo"></a><div class="header-spacer"></div></div></header>
  <main class="page-main form-page-main">
    <section class="form-card">
      <h1>Ride Request</h1>
      <form class="standard-form" id="customerRideRequestForm">
        <label class="form-field"><span>Pick Up Location</span><input id="customerRequestPickup" type="text" required></label>
        <div class="destination-group" id="customerRequestDestinations">
          <label class="form-field"><span>Destination</span><span class="destination-line"><input class="destination-input" type="text" required><button class="destination-add" id="addCustomerRequestDestination" type="button">+</button></span></label>
        </div>
        <label class="form-field"><span>Seat Fare</span><input id="customerRequestFare" type="number" min="0" required></label>
        <button class="form-submit customer-menu-color" type="submit">Ride Request</button>
      </form>
    </section>
  </main>
  <script src="../../shared/js/app.js"></script>
</body>
</html>
