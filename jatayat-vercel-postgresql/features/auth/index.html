<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In | Jatra</title>
  <link rel="stylesheet" href="../../shared/css/style.css">
</head>
<body data-page="auth">
  <header class="site-header">
    <div class="header-inner header-center-only">
      <a class="brand" href="../../features/auth/index.html" aria-label="Jatra Home">
        <img src="../../shared/assets/images/logo.png" alt="Jatra logo">
      </a>
    </div>
  </header>

  <main class="page-main auth-main">
    <section class="form-card auth-card">
      <div class="auth-switch">
        <button class="auth-switch-button active" id="showLogin" type="button">Log In</button>
        <button class="auth-switch-button" id="showSignup" type="button">Sign Up</button>
      </div>

      <form class="standard-form" id="loginForm">
        <label class="form-field">
          <span>Student ID</span>
          <input id="loginStudentId" type="text" required>
        </label>
        <label class="form-field">
          <span>Email</span>
          <input id="loginEmail" type="email" pattern="^[^@ ]+@bscse[.]uiu[.]ac[.]bd$" required>
        </label>
        <label class="form-field">
          <span>Password</span>
          <input id="loginPassword" type="password" required>
        </label>
        <button class="form-submit rider-menu-color" type="submit">Log In</button>
      </form>

      <form class="standard-form hidden" id="signupForm">
        <label class="form-field">
          <span>Name</span>
          <input id="signupName" type="text" required>
        </label>
        <label class="form-field">
          <span>Student ID</span>
          <input id="signupStudentId" type="text" required>
        </label>
        <label class="form-field">
          <span>Email</span>
          <input id="signupEmail" type="email" pattern="^[^@ ]+@bscse[.]uiu[.]ac[.]bd$" required>
        </label>
        <label class="form-field">
          <span>Password</span>
          <input id="signupPassword" type="password" minlength="6" required>
        </label>
        <button class="form-submit customer-menu-color" type="submit">Sign Up</button>
      </form>


    </section>
  </main>

  <script src="../../shared/js/app.js"></script>
</body>
</html>
