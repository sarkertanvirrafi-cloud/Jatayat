<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ride Details | Jatra</title>
  <link rel="stylesheet" href="../../shared/css/style.css">
</head>
<body data-page="ride-details">
  <header class="site-header">
    <div class="header-inner">
      <a class="back-link" href="../../features/auth/index.html" aria-label="Back to home">&#8592;</a>
      <a class="brand" href="../../features/auth/index.html" aria-label="Jatra Home">
        <img src="../../shared/assets/images/logo.png" alt="Jatra logo">
      </a>
      <div class="header-spacer"></div>
    </div>
  </header>

  <main class="page-main">
    <section class="map-section" aria-label="Ride map">
      <div class="map-ui">
        <div class="road road-one"></div>
        <div class="road road-two"></div>
        <div class="road road-three"></div>
        <div class="map-pin pin-you"><span></span><b>You</b></div>
        <div class="map-pin pin-other"><span></span><b id="mapOtherLabel">Rider</b></div>
      </div>
    </section>

    <section class="details-grid">
      <article class="info-card">
        <h2 id="personInfoTitle">Rider Info</h2>
        <div class="info-row"><span>Name</span><strong id="personName">Afroza</strong></div>
        <div class="info-row"><span>Department</span><strong id="personDepartment">BBA</strong></div>
        <div class="info-row"><span>Student ID</span><strong id="personStudentId">0112310151</strong></div>
        <div class="info-row"><span>Phone Number</span><strong id="personPhone">01XXXXXXXXX</strong></div>
      </article>

      <article class="info-card">
        <h2>Ride Info</h2>
        <div class="info-row"><span>Starting Place</span><strong>United International University</strong></div>
        <div class="info-row"><span>Destination</span><strong>Bashundhara R/A</strong></div>
        <div class="info-row"><span>Distance</span><strong>4.8 km</strong></div>
        <div class="info-row"><span>Estimated Time</span><strong>18 min</strong></div>
        <div class="info-row"><span>Total Fare</span><strong>৳ 120</strong></div>
      </article>
    </section>

    <section class="request-actions" aria-label="Ride request actions">
      <button class="request-button decline-button" id="declineRequest">Decline</button>
      <button class="request-button accept-button" id="acceptRequest">Accept</button>
    </section>
  </main>

  <script src="../../shared/js/app.js"></script>
</body>
</html>
